<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Manufacturing+Consent&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mystery+Quest&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/stem4girls-favicon.svg" />
    <script src="js/roadmap-ai.js" defer></script>
    <!-- 1. Load the html2pdf library from Cloudflare's cdnjs -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>ROADMAP</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="roadmap-form-container">
        <div class="roadmap-form-heading">
          <h1 class="roadmap-title">Roadmap with AI</h1>
          <p class="roadmap-subtitle">
            Please fill this form to get a roadmap to the specific thing you
            want to learn
          </p>
        </div>
        <form id="roadmap-form" class="form-container">
          <div class="input-group">
            <label for="learning-subject">Learning Subject</label>
            <input
              type="text"
              id="learning-subject"
              placeholder="eg., Software Engineering"
              required
            />
          </div>
          <div class="input-group">
            <label for="time-commitment">Daily Time Commitment</label>
            <input
              type="text"
              id="time-commitment"
              placeholder="eg., 1 Hours per day"
              required
            />
          </div>
          <div class="input-group">
            <label for="current-experience">Current Experience</label>
            <input
              type="text"
              id="current-experience"
              placeholder="eg., Begineer"
              required
            />
          </div>
          <div class="input-group">
            <label for="primary-goal">Primary Goal</label>
            <input
              type="text"
              id="primary-goal"
              placeholder="eg., For Hobby"
              required
            />
          </div>
          <div class="input-group">
            <label for="learning-duration">Learning Duration</label>
            <input
              type="text"
              id="learning-duration"
              placeholder="eg., 30days"
              required
            />
          </div>
          <div class="input-group">
            <label for="preferred-resource">Preferred Resource</label>
            <input
              type="text"
              id="preferred-resource"
              placeholder="eg., Youtube"
              required
            />
          </div>

          <div class="submit-button-container">
            <button type="submit" id="submit-btn">Generate Roadmap</button>
          </div>
        </form>
      </section>
      <section class="ai-response"></section>
    </main>
    <footer>
      <small
        >&copy; 2026 STEM4GIRLS, Developed by Yair Linn Htet for Industrial
        Training at Myingyan G.T.I</small
      >
    </footer>
  </body>
</html>
